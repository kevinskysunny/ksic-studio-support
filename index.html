<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KSIC Studio public app support and video library">
  <title>App Support & Video Library</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #18202b;
      --muted: #687386;
      --line: #dce2ea;
      --accent: #1769ff;
      --accent-soft: #eaf1ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c1016;
        --card: #141a23;
        --text: #f4f7fb;
        --muted: #9da8b8;
        --line: #293343;
        --accent: #6da0ff;
        --accent-soft: #182742;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    header, main, footer { width: min(1040px, calc(100% - 40px)); margin-inline: auto; }
    header { padding: 72px 0 36px; }
    .eyebrow { color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 10px 0 12px; font-size: clamp(36px, 6vw, 64px); line-height: 1.03; letter-spacing: -.045em; }
    header p { max-width: 680px; color: var(--muted); font-size: 18px; line-height: 1.65; }
    .toolbar { display: flex; align-items: center; gap: 12px; margin-top: 24px; }
    button, .button {
      border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text);
      padding: 9px 13px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; padding-bottom: 64px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; box-shadow: 0 16px 40px #0000000d; }
    .card-head { display: flex; justify-content: space-between; gap: 16px; align-items: start; }
    h2 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
    .platform { border-radius: 999px; background: var(--accent-soft); color: var(--accent); padding: 5px 9px; font-size: 12px; font-weight: 700; }
    .summary { min-height: 52px; margin: 12px 0 20px; color: var(--muted); line-height: 1.55; }
    .links { display: flex; flex-wrap: wrap; gap: 8px; }
    .video-list { margin: 22px 0 0; padding: 18px 0 0; border-top: 1px solid var(--line); list-style: none; }
    .video-list li + li { margin-top: 12px; }
    .video-link { color: var(--accent); font-weight: 700; text-decoration: none; }
    .video-link:hover { text-decoration: underline; }
    .meta, .empty { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; }
    footer { border-top: 1px solid var(--line); padding: 22px 0 48px; color: var(--muted); font-size: 13px; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">Public Support Hub</div>
    <h1 id="heading">App Support & Video Library</h1>
    <p id="intro">Browse our apps, support pages, privacy policies, and browser-playable introduction videos.</p>
    <div class="toolbar">
      <button id="language" type="button">简体中文</button>
      <a class="button" href="index.json">View index.json</a>
    </div>
  </header>

  <main>
    <section id="apps" class="grid" aria-live="polite"></section>
    <noscript>
      <p>JavaScript is required for the catalog view. Open <a href="index.json">index.json</a> or use these direct links:</p>
      <ul>
        <li><a href="review/">KSIC Studio review demo</a></li>
        <li><a href="presenter-deck/review/">PresenterDeck bilingual feature demo</a></li>
      </ul>
    </noscript>
  </main>

  <footer>
    Catalog source: <a href="index.json">index.json</a> · Updated <span id="updated">—</span>
  </footer>

  <script>
    const copy = {
      en: {
        heading: 'App Support & Video Library',
        intro: 'Browse our apps, support pages, privacy policies, and browser-playable introduction videos.',
        language: '简体中文', support: 'Support', privacy: 'Privacy', play: 'Play video', empty: 'Introduction video coming soon', index: 'View index.json'
      },
      zh: {
        heading: '应用支持与在线视频库',
        intro: '统一查看我们的 App、支持页面、隐私政策和可在线播放的介绍视频。',
        language: 'English', support: '支持', privacy: '隐私政策', play: '播放视频', empty: '介绍视频即将上线', index: '查看 index.json'
      }
    };
    let catalog;
    let language = navigator.language.toLowerCase().startsWith('zh') ? 'zh' : 'en';

    function link(label, href) {
      const element = document.createElement('a');
      element.className = 'button';
      element.href = href;
      element.textContent = label;
      return element;
    }

    function render() {
      const text = copy[language];
      document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
      document.title = text.heading;
      document.querySelector('#heading').textContent = text.heading;
      document.querySelector('#intro').textContent = text.intro;
      document.querySelector('#language').textContent = text.language;
      document.querySelector('.toolbar .button').textContent = text.index;
      document.querySelector('#updated').textContent = catalog.updatedAt;

      const container = document.querySelector('#apps');
      container.replaceChildren();
      for (const app of catalog.apps) {
        const card = document.createElement('article');
        card.className = 'card';

        const head = document.createElement('div');
        head.className = 'card-head';
        const title = document.createElement('h2');
        title.textContent = app.name;
        const platform = document.createElement('span');
        platform.className = 'platform';
        platform.textContent = app.platform;
        head.append(title, platform);

        const summary = document.createElement('p');
        summary.className = 'summary';
        summary.textContent = app.summary[language];

        const links = document.createElement('div');
        links.className = 'links';
        if (app.supportUrl) links.append(link(text.support, app.supportUrl));
        if (app.privacyUrl) links.append(link(text.privacy, app.privacyUrl));

        const videos = document.createElement('ul');
        videos.className = 'video-list';
        if (!app.videos.length) {
          const empty = document.createElement('li');
          empty.className = 'empty';
          empty.textContent = text.empty;
          videos.append(empty);
        }
        for (const video of app.videos) {
          const item = document.createElement('li');
          const anchor = document.createElement('a');
          anchor.className = 'video-link';
          anchor.href = video.playerUrl;
          anchor.textContent = `${text.play} · ${video.title[language]}`;
          const meta = document.createElement('span');
          meta.className = 'meta';
          meta.textContent = video.language;
          item.append(anchor, meta);
          videos.append(item);
        }

        card.append(head, summary, links, videos);
        container.append(card);
      }
    }

    document.querySelector('#language').addEventListener('click', () => {
      language = language === 'zh' ? 'en' : 'zh';
      render();
    });

    fetch('index.json')
      .then(response => {
        if (!response.ok) throw new Error(`Catalog request failed: ${response.status}`);
        return response.json();
      })
      .then(data => { catalog = data; render(); })
      .catch(error => {
        document.querySelector('#apps').textContent = error.message;
      });
  </script>
</body>
</html>
